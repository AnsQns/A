<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日麻點數計算</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>請選擇翻數：</p>
    <select id="fanNumber">
        <option value="1">1番</option>
        <option value="2">2番</option>
        <option value="3">3番</option>
        <option value="4">4番</option>
        <option value="5">滿貫</option>
        <option value="6">跳滿</option>
        <option value="8">倍滿</option>
        <option value="11">三倍滿</option>
        <option value="13">役滿</option>
        <option value="26">二倍役滿</option>
    </select>
    <p>請選擇符數：</p>
    <select id="fuNumber">
        <option value="20">20符</option>
        <option value="25">25符</option>
        <option value="30">30符</option>
        <option value="40">40符</option>
        <option value="50">50符</option>
        <option value="60">60符</option>
        <option value="70">70符</option>
    </select>
    <div class="option-container">
        <div class="option" id="btn-dealer"    onclick="selectOption(true)">親家</div>
        <div class="option" id="btn-nondealer" onclick="selectOption(false)">子家</div>
    </div>
    <p id="result1"></p>
    <p id="result2"></p>

    <script src="Points.js"></script>
    <script>
    function selectOption(isDealer) {
        document.getElementById('btn-dealer').classList.toggle('selected', isDealer);
        document.getElementById('btn-nondealer').classList.toggle('selected', !isDealer);
        calculate(isDealer);
    }
    </script>
</body>
</html>
